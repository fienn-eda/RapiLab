[pytest]
filterwarnings =
    error
    # starlette 1.3 deprecates its httpx-backed TestClient in favor of httpx2,
    # but fastapi.testclient still imports the httpx one - third-party code we
    # can't change. Everything else escalates to an error (pristine output).
    ignore:Using `httpx` with `starlette.testclient` is deprecated
