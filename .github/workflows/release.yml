name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # 릴리스를 만들고 자산을 붙이는 데 필요하다

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Install app deps
        run: pip install -r backend/requirements-app.txt

      # 태그가 곧 앱 버전이다. 이 값이 번들에 들어가야 설치된 앱이 자기가 어느
      # 릴리스인지 알고 업데이트를 판단할 수 있다 - 빼먹으면 자동 업데이트가
      # 조용히 꺼진 빌드가 나간다.
      - name: Build
        run: python scripts/build_app.py --version ${{ github.ref_name }}

      # 내보내기 전에 얼린 것이 실제로 도는지 본다. 번들 경로, 버전 스탬프,
      # 프로세스 풀, GUI 백엔드 적재는 얼렸을 때만 깨지는 것들이라 여기서만 잡힌다.
      #
      # **직접 호출하면 안 된다.** 이 exe는 windowed(console=False)라 셸이 기다리지
      # 않고 종료 코드도 안 받는다 - `dist/RapiLab/RapiLab.exe --selftest`는
      # 실패해도 항상 초록이었다. v0.1.0~v0.1.3이 그렇게 나갔다: 로그에는
      # "FAIL: no units"가 찍혀 있는데 단계는 success였다. `-Wait -PassThru`가
      # 진짜 종료 코드를 준다(실측: 직접 호출은 LASTEXITCODE가 비어 있고 이쪽은 1).
      - name: Smoke the built app
        run: |
          $app = Start-Process -FilePath dist\RapiLab\RapiLab.exe `
                               -ArgumentList '--selftest' -Wait -PassThru
          $log = "$env:LOCALAPPDATA\RapiLab\selftest.log"
          if (Test-Path $log) { Get-Content $log }
          if ($app.ExitCode -ne 0) {
            throw "selftest failed (exit $($app.ExitCode)) - 위 로그를 볼 것"
          }

      - name: Package
        run: Compress-Archive -Path dist/RapiLab -DestinationPath RapiLab-${{ github.ref_name }}.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: RapiLab-${{ github.ref_name }}.zip
          generate_release_notes: true
