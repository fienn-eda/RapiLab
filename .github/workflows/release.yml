name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # 릴리스를 만들고 자산을 붙이는 데 필요하다

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Install app deps
        run: pip install -r backend/requirements-app.txt

      # 태그가 곧 앱 버전이다. 이 값이 번들에 들어가야 설치된 앱이 자기가 어느
      # 릴리스인지 알고 업데이트를 판단할 수 있다 - 빼먹으면 자동 업데이트가
      # 조용히 꺼진 빌드가 나간다.
      - name: Build
        run: python scripts/build_app.py --version ${{ github.ref_name }}

      # 내보내기 전에 얼린 것이 실제로 도는지 본다. 번들 경로, 버전 스탬프,
      # 프로세스 풀은 얼렸을 때만 깨지는 것들이라 여기서만 잡힌다.
      - name: Smoke the built app
        run: dist/RapiLab/RapiLab.exe --selftest

      - name: Package
        run: Compress-Archive -Path dist/RapiLab -DestinationPath RapiLab-${{ github.ref_name }}.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: RapiLab-${{ github.ref_name }}.zip
          generate_release_notes: true
